name: deploy

on:
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.ref }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image name
        id: image
        run: |
          name="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "ref=$name:$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.ref }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: self-hosted
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ${{ needs.build.outputs.image }}
      DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download image
        run: docker compose pull

      - name: Start the new container
        run: docker compose up -d --no-build --remove-orphans

      - name: Check the bot stayed up
        run: |
          sleep 20
          docker compose logs --tail 50
          test "$(docker inspect -f '{{.State.Running}} {{.RestartCount}}' social-bot)" = "true 0"

      # Compares without printing: fails if a secret did not reach the container intact.
      - name: Check the container received its environment
        run: |
          for name in DISCORD_TOKEN DATABASE_URL; do
            if [ "$(docker exec social-bot printenv "$name")" != "${!name}" ]; then
              echo "::error::$name inside the container does not match the secret"
              exit 1
            fi
          done

      - name: Remove this bot's old images
        run: docker image prune -af --filter label=app=social-bot
